services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: company-inventory-api:release
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.production}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - api_bridge

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrate
    image: company-inventory-api-migrate:release
    profiles:
      - migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
    networks:
      - api_bridge

networks:
  api_bridge:
    driver: bridge
